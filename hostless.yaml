# Hostless builds the existing multi-stage Docker image. The no-card free tier
# rejects custom scaling, so resource and replica settings are intentionally
# omitted and left to the platform defaults.
build:
  system: docker

dockerfile_path: "./Dockerfile"
working_directory: "/"
build_context_directory: "/"

health_check:
  type: http
  # Hostless should only use process liveness while rolling out a container.
  # The stricter /api/health/ready endpoint remains available for operators.
  http_path: "/api/health/live"
  interval_in_seconds: 30
